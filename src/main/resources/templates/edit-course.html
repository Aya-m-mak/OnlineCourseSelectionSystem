<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>编辑课程 - Online Course Selection System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #2b5fab;
            color: white;
            padding: 18px 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 5px 0 0;
        }

        .container {
            width: 600px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #2b5fab;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5e0;
            border-radius: 6px;
            font-size: 16px;
        }

        input[readonly] {
            background: #f1f3f5;
        }

        .save-button {
            background: #2b5fab;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .back-button {
            display: inline-block;
            margin-left: 12px;
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            color: #2b5fab;
            border: 1px solid #2b5fab;
        }

        .footer {
            text-align: center;
            color: #999;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>管理员控制台</h1>
    <p>Online Course Selection System</p>
</div>

<div class="container">

    <h2>编辑课程</h2>
    <div th:if="${param.error != null and param.error[0] == 'capacity'}"
         style="background-color: #ffe6e6;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;">
        课程容量不能小于已选人数，且必须大于0！
    </div>

    <form action="/admin/update-course" method="post">

        <input type="hidden"
               name="courseId"
               th:value="${course.id}">

        <div class="form-group">
            <label>课程名称</label>
            <input type="text"
                   th:value="${course.courseName}"
                   readonly>
        </div>

        <div class="form-group">
            <label>授课教师</label>
            <input type="text"
                   name="teacher"
                   th:value="${course.teacher}"
                   required>
        </div>

        <div class="form-group">
            <label>课程容量</label>
            <input type="number"
                   name="capacity"
                   th:value="${course.capacity}"
                   min="1"
                   required>
        </div>

        <button type="submit" class="save-button">
            保存修改
        </button>

        <a href="/admin" class="back-button">
            返回
        </a>

    </form>

</div>

<div class="footer">
    在线选课系统 · Online Course Selection System
</div>

</body>
</html>
