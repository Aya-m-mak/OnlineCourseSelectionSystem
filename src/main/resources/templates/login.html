<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>在线选课系统 - 登录</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .header {
            background: #2457a6;
            color: white;
            padding: 22px 50px;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.85;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }

        .login-box {
            width: 430px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 3px 18px rgba(0, 0, 0, 0.10);
        }

        .login-box h2 {
            text-align: center;
            color: #2457a6;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .role-title {
            font-size: 15px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .role-buttons {
            display: flex;
            gap: 12px;
        }

        .role-button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .student {
            background: #2457a6;
            color: white;
        }

        .student:hover {
            background: #183f7a;
        }

        .admin {
            background: #eef3fa;
            color: #2457a6;
            border: 1px solid #cbd8ea;
        }

        .admin:hover {
            background: #dfe9f6;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>在线选课系统</h1>
    <p>Online Course Selection System</p>
</div>

<div class="container">

    <div class="login-box">

        <h2>用户登录</h2>

        <p class="description">
            请选择您的登录身份
        </p>

        <div class="role-title">
            登录身份
        </div>

        <div class="role-buttons">

            <a href="/student-login" class="role-button student">
                学生登录
            </a>

            <a href="/admin-login" class="role-button admin">
                管理员登录
            </a>

        </div>

    </div>

</div>

<div class="footer">
    在线选课系统 · Online Course Selection System
</div>

</body>
</html>
