<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生登录 - 在线选课系统</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .header {
            background: #2457a6;
            color: white;
            padding: 22px 50px;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.85;
        }

        .container {
            min-height: 620px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 410px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
        }

        .login-box h2 {
            text-align: center;
            color: #2457a6;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2457a6;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2457a6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #183f7a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2457a6;
            text-decoration: none;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 13px;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>在线选课系统</h1>
    <p>Online Course Selection System</p>
</div>

<div class="container">

    <div class="login-box">

        <h2>学生登录</h2>
        <div th:if="${param.error != null and param.error[0] == 'name'}"
             style="background-color: #ffe6e6;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;">
            学号与姓名不匹配，请重新输入！
        </div>
        <p class="subtitle">请输入学生信息</p>

        <form action="/student-login" method="post">

            <div class="form-group">
                <label for="studentId">学号</label>
                <input
                        type="text"
                        id="studentId"
                        name="studentId"
                        placeholder="请输入学号"
                        required>
            </div>

            <div class="form-group">
                <label for="studentName">姓名</label>
                <input
                        type="text"
                        id="studentName"
                        name="studentName"
                        placeholder="请输入姓名"
                        required>
            </div>

            <button type="submit" class="login-btn">
                登录
            </button>

        </form>

        <a href="/" class="back-link">
            ← 返回
        </a>

    </div>

</div>

<div class="footer">
    在线选课系统 · Online Course Selection System
</div>

</body>
</html>
