<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>管理员登录</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
        }

        .header {
            background: #2b5fab;
            color: white;
            padding: 18px 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 14px;
        }

        .login-container {
            width: 420px;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .login-container h2 {
            text-align: center;
            color: #2b5fab;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dbe5;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2b5fab;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2b5fab;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #214d8d;
        }

        .error {
            background: #ffeaea;
            color: #d93025;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #2b5fab;
            text-decoration: none;
        }

        .footer {
            text-align: center;
            color: #999;
            margin-top: 50px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>在线选课系统</h1>
    <p>Online Course Selection System</p>
</div>

<div class="login-container">

    <h2>管理员登录</h2>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form action="/admin-login" method="post">

        <div class="form-group">
            <label for="adminId">管理员账号</label>
            <input
                    type="text"
                    id="adminId"
                    name="adminId"
                    placeholder="请输入管理员账号"
                    required>
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="请输入密码"
                    required>
        </div>

        <button type="submit" class="login-button">
            登录
        </button>

    </form>

    <div class="back-link">
        <a href="/">返回首页</a>
    </div>

</div>

<div class="footer">
    在线选课系统 · Online Course Selection System
</div>

</body>
</html>
